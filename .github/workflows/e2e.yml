name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build ocpctl
        run: go build -o ocpctl .

      - name: Apply local environment
        run: ./ocpctl env apply local

      - name: Wait for onboarding cluster
        run: |
          until kind get clusters 2>/dev/null | grep -q "^local-onboarding$"; do
            echo "Waiting for local-onboarding cluster..."
            sleep 10
          done

      - name: Get onboarding kubeconfig
        run: |
          kind get kubeconfig --name local-onboarding > /tmp/onboarding.kubeconfig
          echo "KUBECONFIG=/tmp/onboarding.kubeconfig" >> "$GITHUB_ENV"

      - name: Wait for ControlPlane CRD
        run: |
          until kubectl wait --for=condition=Established \
            crd/controlplanes.core.open-control-plane.io \
            --timeout=10s 2>/dev/null; do
            echo "CRD not yet available, retrying..."
            sleep 5
          done

      - name: Create ControlPlane
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: core.open-control-plane.io/v2alpha1
          kind: ControlPlane
          metadata:
            name: test
            namespace: default
          spec:
            iam: {}
          EOF

      - name: Wait for ControlPlane to be ready
        run: |
          until kubectl wait cp test -n default \
            --for=jsonpath='{.status.phase}'=Ready \
            --timeout=10s 2>/dev/null; do
            echo "ControlPlane not yet ready, retrying..."
            kubectl get cp test -n default 2>/dev/null || true
            sleep 5
          done

      - name: Get MCP cluster kubeconfig via AccessRequest
        run: |
          PLATFORM_KUBECONFIG=$(kind get kubeconfig --name local-platform)

          # Find the MCP Cluster CR on the platform cluster
          MCP_CLUSTER=$(kubectl --kubeconfig <(echo "$PLATFORM_KUBECONFIG") \
            get clusters.clusters.openmcp.cloud \
            -n openmcp-system \
            -o json \
            | jq -r '.items[] | select(.spec.purposes[] == "mcp") | .metadata.name' \
            | head -1)
          echo "MCP Cluster CR: ${MCP_CLUSTER}"
          [ -n "$MCP_CLUSTER" ] || { echo "No MCP cluster CR found"; exit 1; }

          # Create an AccessRequest for the MCP cluster
          kubectl --kubeconfig <(echo "$PLATFORM_KUBECONFIG") apply -f - <<EOF
          apiVersion: clusters.openmcp.cloud/v1alpha1
          kind: AccessRequest
          metadata:
            name: e2e-mcp-access
            namespace: openmcp-system
          spec:
            clusterRef:
              name: ${MCP_CLUSTER}
              namespace: openmcp-system
            token:
              roleRefs:
                - name: cluster-admin
                  kind: ClusterRole
          EOF

          # Wait for the AccessRequest to be granted
          until kubectl --kubeconfig <(echo "$PLATFORM_KUBECONFIG") \
            wait accessrequest e2e-mcp-access -n openmcp-system \
            --for=jsonpath='{.status.phase}'=Granted \
            --timeout=10s 2>/dev/null; do
            echo "Waiting for AccessRequest to be granted..."
            sleep 5
          done

          # Extract the kubeconfig from the secret
          SECRET=$(kubectl --kubeconfig <(echo "$PLATFORM_KUBECONFIG") \
            get accessrequest e2e-mcp-access -n openmcp-system \
            -o jsonpath='{.status.secretRef.name}')
          kubectl --kubeconfig <(echo "$PLATFORM_KUBECONFIG") \
            get secret "$SECRET" -n openmcp-system \
            -o jsonpath='{.data.kubeconfig}' | base64 -d > /tmp/mcp.kubeconfig

      - name: Verify MCP cluster pods are ready
        run: |
          until kubectl wait --for=condition=Ready pods --all --all-namespaces \
            --timeout=10s --kubeconfig /tmp/mcp.kubeconfig 2>/dev/null; do
            echo "MCP cluster pods not yet ready, retrying..."
            sleep 5
          done

      - name: Cleanup
        if: always()
        run: ./ocpctl env delete local || true
